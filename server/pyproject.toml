[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chai-governance-api"
version = "0.1.0"
description = "Shared storage for the CHAI governance dashboard: projects, an append-only audit log, and an SSE change stream."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Loose upper bounds: pinned to a major so a surprise breaking release cannot
# land in a rebuild, but free to take patches. The exact set that ships is
# pinned by the image digest, not by this file.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "asyncpg>=0.29,<0.33",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://tonyreina.github.io/ai_governance_healthcare/"
Documentation = "https://tonyreina.github.io/ai_governance_healthcare/deploy/"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Every async fixture lives for one test; the DB-backed tests create and drop
# their own rows, so a session-scoped loop would leak state between them.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
  "db: needs a live PostgreSQL (set TEST_DATABASE_URL)",
]
