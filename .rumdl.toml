# rumdl configuration — https://rumdl.dev

[global]
# Zensical shares Material for MkDocs' Markdown dialect, so the mkdocs flavor is
# what keeps admonitions (!!! warning) and attr_list ({ .md-button }) from being
# reported as errors.
flavor = "mkdocs"

exclude = [
    ".git",
    ".github",
    ".pixi",
    "site",      # Zensical build output
    ".cache",    # Zensical build cache
    # Test data for the spelling guard, kept as a verifier wrote it (#169).
    "tests/fixtures/spelling_corpus",
]
