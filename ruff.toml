# Ruff: linter and formatter for this project's Python.
# Targets the floor the pixi environment guarantees.
target-version = "py311"
line-length = 88

exclude = [".pixi", "site", ".cache", "server/migrations"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff's own
]

[lint.per-file-ignores]
# B008 flags a function call in a default argument. In FastAPI that call IS the
# dependency-injection idiom (`user: Identity = Depends(current_user)`), and
# rewriting it to satisfy the rule would break the framework.
"server/app/routes.py" = ["B008"]
"server/app/agent.py" = ["B008"]
# SIM117 wants nested `with` blocks combined. In the SSE tests the nesting is
# meaningful -- an outer server fixture around an inner subscription -- and
# flattening it obscures which context owns what.
"server/tests/*" = ["B008", "SIM117", "E501"]
"mcp/tests/*" = ["B008", "SIM117", "E501"]

[format]
docstring-code-format = true
