# =============================================================================
# CHAI governance dashboard -- full stack.
#
#     browser ──► proxy (Caddy) ──► api (REST + SSE) ──► db (Postgres)
#                 static dashboard
#
# THE SECURITY MODEL, in one sentence: the API does not authenticate anybody.
# It trusts an identity header that the proxy sets, and it refuses to read
# identity from anywhere else. That is only safe if the API cannot be reached
# except through the proxy -- otherwise anyone who can open a socket to the API
# sets the header themselves and becomes whoever they like.
#
# This file enforces that with networking rather than with a README sentence:
#
#   * `api` publishes NO host port, so it is unreachable from the host, the
#     LAN, or the internet. Only containers sharing a Docker network with it
#     can connect.
#   * The only network `api` shares with anything internet-facing is `edge`,
#     and the only other member of `edge` is `proxy`.
#   * `db` lives on `data`, which is `internal: true` -- Docker gives that
#     bridge no gateway, so Postgres has no route off the host in either
#     direction, and `db` publishes no host port either.
#
# Before adding a service, ask which of those two networks it belongs on.
# Putting anything else on `edge` widens the trust boundary.
#
# Run:  cp .env.example .env && docker compose up -d
# Dev:  docker compose -f compose.yaml -f compose.dev.yaml up   (or: make dev)
# =============================================================================

name: chai-governance

# Every service's log goes through Docker's json-file driver with a size cap. Without
# one, Docker keeps a container's log without bound until the disk is full, and
# nothing here ships it anywhere: the cap makes local retention finite and honest
# (about 50 MB a service), and docs/deploy.md says where to send the security
# stream so it is kept for as long as your policy needs (#38).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Postgres. Holds the project documents and the per-project audit log.
  # ---------------------------------------------------------------------------
  db:
    # Pinned to a major version, never :latest. Postgres does not auto-migrate
    # its on-disk format: moving 17 -> 18 under a live volume makes the cluster
    # unreadable and needs pg_upgrade or a dump/restore. A floating tag would
    # make that happen by surprise on some unrelated `docker compose pull`.
    logging: *default-logging
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped

    # Container baseline (#50). The cluster's entrypoint starts as root and drops
    # to the postgres user, so capabilities cannot be dropped wholesale here;
    # no-new-privileges still stops a process from gaining any, and the limits
    # stop one service from taking the host. Override with DB_MEM_LIMIT for a
    # larger deployment.
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-2}
    pids_limit: 512

    # Deliberately NO `ports:`. Postgres is not published to the host in this
    # file. compose.dev.yaml publishes it on 127.0.0.1 for psql and GUI tools;
    # that override is for laptops only.
    networks:
      - data

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      POSTGRES_USER: ${POSTGRES_USER:-chai}
      # No default on purpose: an unset password fails the run loudly instead of
      # quietly standing up a database with a password someone copied from a
      # sample file. Put a real one in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      # Keep the cluster in a subdirectory of the mount point. Cosmetic with a
      # named volume; load-bearing the moment somebody swaps in a bind mount,
      # where initdb refuses a directory that already contains lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      # NAMED VOLUME -- this is what makes the data survive `docker compose
      # down`. `down` removes containers and networks but leaves named volumes
      # alone; only `docker compose down -v` destroys this one. See the
      # `volumes:` block at the bottom.
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # Over TCP on 127.0.0.1 rather than the Unix socket, because TCP is how
      # the API connects -- a check on the socket can pass while the TCP
      # listener is still closed. The $$ escapes compose interpolation so the
      # container's shell expands these, not compose.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      # First boot runs initdb, which briefly starts and stops a private server.
      # Failures inside start_period do not count against `retries`.
      start_period: 30s

  # ---------------------------------------------------------------------------
  # The API. Implements the REST + SSE surface the browser's ApiStore calls:
  #   GET    /api/health                  {status, version}
  #   GET    /api/me                      identity, read from the proxy header
  #   GET    /api/projects                list
  #   POST   /api/projects/{id}           create, 409 if it exists
  #   PATCH  /api/projects/{id}           deep merge (arrays replace)
  #   DELETE /api/projects/{id}           project + its log
  #   GET    /api/projects/{id}/log       newest 60, desc by .at
  #   POST   /api/projects/{id}/log       append one entry
  #   GET    /api/events                  text/event-stream, one event per change
  # ---------------------------------------------------------------------------
  api:
    # Built from ./server locally; set API_IMAGE to a registry tag (pinned by
    # digest or version, not :latest) when deploying to a cloud.
    logging: *default-logging
    image: ${API_IMAGE:-chai-governance-api:local}
    build:
      context: ./server
    restart: unless-stopped

    # Container baseline (#50). The image already runs as uid 10001 with no shell;
    # this takes away what that user could still use. It writes nothing outside
    # /tmp, so the root filesystem is read-only, and it binds an unprivileged
    # port, so it needs no capability at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-2}
    pids_limit: 256

    # Deliberately NO `ports:`. THIS IS THE SECURITY PROPERTY. Publishing a
    # port here -- even 127.0.0.1:8000 -- lets anything on the host bypass the
    # proxy and set the identity header itself.
    networks:
      - edge   # reachable by the proxy, and by nothing else on this stack
      - data   # reaches Postgres

    environment:
      # The PIECES, not a URL. This used to be
      # `postgresql://user:${POSTGRES_PASSWORD}@db:5432/...`, and compose cannot
      # percent-encode, so a "/" in the password ended the URL's authority and
      # the API crashed on startup reading the password as a port number. The
      # documented generator (`openssl rand -base64 32`) produces a "/" about half
      # the time. The API assembles the URL itself, with the password encoded.
      # Set APP_DATABASE_URL instead to point at a managed instance.
      #
      # The API gets the RESTRICTED role's credential and NOT the owner's (#48).
      # The owner can disable the append-only triggers that the audit log and the
      # version history depend on, and the API is the process an attacker would
      # compromise, so it must not hold that credential. It lives in the one-shot
      # `migrate` service below, which creates the schema and this role.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-chai_app}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      # Session controls (#49). The front door's own session lifetime is the real
      # automatic-logoff control (docs/deploy.md); these are defense in depth.
      SSE_MAX_LIFETIME_SECONDS: ${SSE_MAX_LIFETIME_SECONDS:-900}
      IDLE_LOCK_MINUTES: ${IDLE_LOCK_MINUTES:-0}
      SIGN_OUT_URL: ${SIGN_OUT_URL:-}
      # Identities with owner rights on every project, each use recorded in that
      # project's audit log (#42). Empty by default.
      EMERGENCY_ACCESS_IDS: ${EMERGENCY_ACCESS_IDS:-}
      # A restricted role cannot create tables; `migrate` does it, first.
      RUN_MIGRATIONS: "false"
      API_PORT: "8000"

      # Which headers carry identity. On every route but /api/agent/, the API reads
      # these and NOTHING else: no cookie, no bearer token, no query parameter. (The
      # agent routes answer to a bearer token and ignore these headers: #164.) Keep
      # them in sync with proxy/Caddyfile.
      AUTH_HEADER_ID: ${AUTH_HEADER_ID:-X-Auth-Request-User}
      AUTH_HEADER_NAME: ${AUTH_HEADER_NAME:-X-Auth-Request-Name}
      AUTH_HEADER_EMAIL: ${AUTH_HEADER_EMAIL:-X-Auth-Request-Email}

      # A scheme prefix the front door puts in front of the identity, which
      # the API removes before storing it. Google IAP sends
      # "accounts.google.com:person@hospital.org"; left in place, every
      # sign-off is attributed to an id that matches nothing in any directory,
      # and the mistake is invisible until somebody tries to reconcile the
      # audit log with a staff list. Empty for every other front door.
      IDENTITY_STRIP_PREFIX: ${IDENTITY_STRIP_PREFIX:-}

      # Belt and braces: the API should refuse a request whose peer address is
      # outside this range, so a misconfigured network cannot silently turn the
      # header into a free-for-all. 172.16.0.0/12 is the default Docker bridge
      # pool; narrow it to the proxy's address if you can.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}

      # Second lock, off while empty. When set, the API answers 403 to any
      # request that lacks X-Proxy-Secret with this value. The proxy service
      # below is given the same variable and sends it (proxy/Caddyfile), so one
      # entry in .env turns the control on at both ends. Setting it on only one
      # side would make every request fail, which is why it is one variable.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}

      # Reject a request that arrives with no identity rather than inventing an
      # anonymous user. Leave this on everywhere except a throwaway demo.
      REQUIRE_IDENTITY: ${REQUIRE_IDENTITY:-true}

      # The read-only agent API (#164, docs/agent-api.md). OFF while AGENT_ID_SECRET is
      # empty: no token can be minted and /api/agent/ answers 404. Set it to a long
      # random value (openssl rand -hex 32) to turn the API on; it keys the opaque
      # ids the API shows in place of people and projects, so keep it like a password.
      AGENT_ID_SECRET: ${AGENT_ID_SECRET:-}
      AGENT_RATE_LIMIT_MAX_REQUESTS: ${AGENT_RATE_LIMIT_MAX_REQUESTS:-60}
      AGENT_FAILURE_RATE_LIMIT_MAX_REQUESTS: ${AGENT_FAILURE_RATE_LIMIT_MAX_REQUESTS:-30}
      AGENT_MAX_ACTIVE_TOKENS: ${AGENT_MAX_ACTIVE_TOKENS:-5}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One JSON object per line, security events named and tagged (#38). `text` is
      # the human-readable line, for a terminal.
      LOG_FORMAT: ${LOG_FORMAT:-json}

    depends_on:
      db:
        # The API waits for a database that actually answers queries, not just
        # for a container that has been created. Without `condition:
        # service_healthy` the API races initdb and crash-loops on first boot.
        condition: service_healthy
      migrate:
        # The schema and the role this API connects as exist before it starts.
        condition: service_completed_successfully

    # No healthcheck here on purpose: server/Dockerfile defines a HEALTHCHECK
    # that already knows which port the app bound (PORT, then API_PORT, then
    # 8000) and uses the interpreter that is in the image. Repeating it here
    # would be a second definition to keep in sync, and the two would drift.
    # `docker compose ps` shows the image's result either way.

  # ---------------------------------------------------------------------------
  # The schema, and the restricted role the API serves as (#48).
  #
  # The ONLY service that holds the database owner's credential. It applies the
  # migrations, creates or updates the serving role from APP_POSTGRES_PASSWORD
  # and grants it exactly what app/roles.py lists, then exits. Idempotent, so it
  # runs on every `up`, which also makes rotating APP_POSTGRES_PASSWORD a restart.
  #
  # On `data` only: it never shares a network with the internet-facing side, and
  # nothing is published. Same image as the API, a different command.
  # ---------------------------------------------------------------------------
  migrate:
    logging: *default-logging
    image: ${API_IMAGE:-chai-governance-api:local}
    build:
      context: ./server
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    networks:
      - data
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-chai}
      POSTGRES_DB: ${POSTGRES_DB:-chai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-chai_app}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-}
      # Which checkpoint decisions end a project, and so when disposal is due, come
      # from the build the proxy serves: its manifest.json, mounted below (D-76). The
      # job refuses to add or drop one, or change the primary, unless
      # RETIREMENT_RULES_ACK acknowledges exactly that change, with the value it
      # prints, and it fails if the file is missing.
      RETIREMENT_MANIFEST: /etc/chai/manifest.json
      RETIREMENT_RULES_ACK: ${RETIREMENT_RULES_ACK:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # The same directory the proxy serves the page from, so the rules and the page
      # are one build. Read-only: the job only reads it. A missing file stops `up`
      # (create_host_path: false) instead of mounting an empty directory.
      - type: bind
        source: ${APP_DIR:-./docs/app}/manifest.json
        target: /etc/chai/manifest.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1
    pids_limit: 64

  # ---------------------------------------------------------------------------
  # Caddy. The only service with a published port.
  #
  # Three jobs:
  #   1. serve the built dashboard (${APP_DIR}/index.html, docs/app by default) at /
  #   2. proxy /api/* to the API, streaming /api/events without buffering
  #   3. own identity: delete any client-supplied identity header, then set it
  #      from a source the operator configured (a fixed dev value locally, the
  #      cloud SSO front door's header in production)
  # ---------------------------------------------------------------------------
  proxy:
    logging: *default-logging
    image: caddy:2@sha256:8dc9fa87b36b25303d1c67d2a09f5824b7f3bfd72cb052f246e5da2133fe29a8
    restart: unless-stopped

    # Container baseline (#50). This is the one service reachable from outside, and
    # it ran as root with every default capability. It now runs as an unprivileged
    # user, drops every capability but the one the binary asks for, and has a
    # read-only root filesystem; /data and /config are the named volumes below.
    #
    # NET_BIND_SERVICE is not for port 80 (Docker lets any user bind it, and the
    # host mapping is the published port): the stock caddy binary carries that
    # file capability, and with `cap_drop: ALL` the kernel refuses to exec it
    # ("operation not permitted") unless it is in the bounding set.
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${PROXY_MEM_LIMIT:-256m}
    cpus: ${PROXY_CPUS:-1}
    pids_limit: 256

    ports:
      # The one way in, and bound to LOOPBACK by default. This stack speaks
      # plain HTTP (SITE_ADDRESS=http://:80), so a default of 0.0.0.0 would
      # serve a governance record to the whole subnet in cleartext on first
      # run. Set HTTP_BIND=0.0.0.0 only once something terminates TLS in
      # front -- the cloud SSO front door, or Caddy itself with SITE_ADDRESS
      # set to a hostname.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"

    networks:
      - edge

    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The Content-Security-Policy, generated from the built dashboard (#154).
      # CSP_FILE names another build's policy; it must be the one generated with
      # the page in APP_DIR, or the browser refuses that page's script.
      - ${CSP_FILE:-./proxy/csp.caddy}:/etc/caddy/csp.caddy:ro
      # The dashboard is a single pre-built static file. It is MOUNTED, not
      # rebuilt in Docker: it is generated on the host by `pixi run build-app`
      # from the sources under app/. Read-only so the web server cannot be
      # tricked into writing to it. APP_DIR names another build's directory; the
      # migrate service reads that build's manifest.json from the same place.
      - ${APP_DIR:-./docs/app}:/srv/app:ro
      # Certificates and OCSP staples, so an automatic-HTTPS deployment does not
      # re-issue from Let's Encrypt on every restart and hit the rate limit.
      - caddy_data:/data
      - caddy_config:/config

    environment:
      # http://:80 means plain HTTP, no automatic HTTPS -- correct for local
      # dev, and correct in GCP/AWS/Azure where the SSO front door terminates
      # TLS and forwards cleartext inside the VPC. Set a bare hostname
      # (governance.example.org) only when Caddy itself is the public edge;
      # then it gets a certificate automatically and you must publish 80 & 443.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}

      # Where identity comes from. Each value is either a literal string (dev)
      # or a Caddy placeholder naming the header the cloud's SSO front door
      # sets. .env.example lists the value for IAP, ALB OIDC and Easy Auth.
      IDENTITY_ID_SOURCE: ${IDENTITY_ID_SOURCE:?set IDENTITY_ID_SOURCE in .env}
      IDENTITY_NAME_SOURCE: ${IDENTITY_NAME_SOURCE:-}
      IDENTITY_EMAIL_SOURCE: ${IDENTITY_EMAIL_SOURCE:-}

      # Sent to the API as X-Proxy-Secret. Same variable as the api service's.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}

      # Canonical header names handed to the API. Must match AUTH_HEADER_* above.
      AUTH_HEADER_ID: ${AUTH_HEADER_ID:-X-Auth-Request-User}
      AUTH_HEADER_NAME: ${AUTH_HEADER_NAME:-X-Auth-Request-Name}
      AUTH_HEADER_EMAIL: ${AUTH_HEADER_EMAIL:-X-Auth-Request-Email}

    depends_on:
      api:
        # Only `service_started`, not `service_healthy`, and on purpose: the
        # dashboard is a static file that should still load (and show its
        # "cannot reach the server" state) while the API is starting or broken.
        # Caddy retries the upstream on every request anyway.
        condition: service_started
      proxy-perms:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Hands the proxy's two volumes to the unprivileged user it now runs as.
  #
  # Named volumes are created root-owned, and a non-root Caddy then cannot write
  # its certificates or its config ("permission denied" on /data/caddy/...), which
  # for an automatic-HTTPS deployment means re-issuing from Let's Encrypt on every
  # restart until the rate limit bites. It also covers an UPGRADE: volumes an
  # earlier, root-run proxy populated are root-owned and are fixed here.
  #
  # One-shot, no network at all, and only the two capabilities chown -R needs
  # (CHOWN to change owner; DAC_READ_SEARCH to descend into directories the proxy
  # created mode 0700 on an earlier run). It is not on `edge`, so it cannot
  # reach the API.
  # ---------------------------------------------------------------------------
  proxy-perms:
    logging: *default-logging
    image: caddy:2@sha256:8dc9fa87b36b25303d1c67d2a09f5824b7f3bfd72cb052f246e5da2133fe29a8
    user: "0:0"
    network_mode: none
    restart: "no"
    command: ["chown", "-R", "65532:65532", "/data", "/config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    read_only: true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32

# -----------------------------------------------------------------------------
# PERSISTENCE
#
# `pgdata` is a named volume, which is the whole reason the database survives:
#
#   docker compose down        containers + networks go; pgdata STAYS
#   docker compose down -v     pgdata is destroyed. There is no undo.
#
# Inspect it with `docker volume inspect chai-governance_pgdata`; back it up
# with `make backup` (pg_dump through the running container), which is the
# supported path -- copying the volume's files out from under a running
# Postgres gives you a torn snapshot.
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Internet-facing side. `proxy` publishes a port here; `api` is here so the
  # proxy can reach it. Adding a third service to this network means that
  # service can also talk straight to the API -- i.e. forge identity. Don't.
  edge:
    driver: bridge

  # `internal: true` tells Docker to create the bridge with no gateway and no
  # NAT rules, so containers on it cannot route to the internet and nothing
  # outside the host can route to them. Postgres is on this network and no
  # other.
  data:
    driver: bridge
    internal: true
