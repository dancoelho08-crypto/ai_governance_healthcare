name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The hooks include check-app, which runs `node --check` when node is on PATH and
# otherwise says it skipped it. REQUIRE_TESTS makes that skip a failure here, as
# in test.yml: a skip exits 0 and reads as a pass.
env:
  REQUIRE_TESTS: "1"

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      # Same hooks a contributor gets locally, so CI cannot drift from them.
      - run: pixi run prek run --all-files --show-diff-on-failure
