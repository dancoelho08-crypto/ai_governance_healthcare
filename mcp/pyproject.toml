[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chai-governance-mcp"
version = "0.1.0"
description = "A read-only MCP server over the governance dashboard's agent API. Optional, off by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Pinned to the 1.x line of the official SDK. The exact set that ships is
# mcp/requirements.txt (hashes), regenerated with `make lock-mcp`.
dependencies = [
  "mcp>=1.30,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.23,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["chai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
