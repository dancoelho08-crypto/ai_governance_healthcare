# Git hooks, run with prek (https://prek.j178.dev) — a drop-in, dependency-free
# replacement for pre-commit. Install the shims once with: pixi run hooks-install
#
# The vendored single-file dashboard is excluded from the whitespace fixers.
# It is a self-contained app with inline JS template literals, where rewriting
# whitespace is not reliably a no-op.
exclude: '^docs/app/index\.html$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # The fingerprint's golden record holds lone surrogates (\ud800), which the
      # JSON grammar allows (RFC 8259, section 8.2) and a JavaScript string can
      # hold, so the fingerprint rule must say how they hash (#177). This hook's
      # parser refuses them. Three tests parse the file with Python's json, so a
      # file that is not JSON still fails, there.
      - id: check-json
        exclude: '^tests/fixtures/fingerprint_record\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: '^docs/assets/.*\.(mp4|webm)$'
      # The one exception to the 512 KB limit: showcase media on the docs site,
      # which is first-party by design (R-05) and so has to live in the repo. It
      # has its own cap rather than no limit, and tests/test_docs_media.py fails if
      # this number and the one the docs page assumes ever differ.
      - id: check-added-large-files
        alias: check-showcase-media-size
        name: check showcase media size (10 MB max)
        args: [--maxkb=10240]
        files: '^docs/assets/.*\.(mp4|webm)$'
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Lint first, then format: ruff-check --fix can rewrite code, and
      # ruff-format should have the last word on layout.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      # Reads .rumdl.toml, so the mkdocs flavor applies here too and Material
      # admonitions are not reported as errors.
      - id: rumdl-check

  - repo: local
    hooks:
      # Catches broken internal links before they reach CI, where the same
      # --strict build gates the deploy. Note: --strict does NOT flag a nav
      # entry pointing at a missing page -- that builds clean, so nav changes
      # still want a look at the rendered site.
      # Blocks non-Latin characters that render like ASCII letters. A URL
      # shared with this project used a Cyrillic o in "who"; that class of
      # substitution is invisible in review and breaks search and anchors.
      # American English only. The word list lives in the script; a quoted
      # British spelling is exempted with `spelling-ok` on the line or an
      # entry in .spelling-allow.
      - id: check-spelling
        name: check for British spellings
        entry: pixi run check-spelling
        language: system
        types: [text]

      # The message catalogs: same keys, placeholders and plural forms as en.json,
      # no markup, and every key used (#80).
      - id: check-i18n
        name: check the message catalogs
        entry: pixi run check-i18n
        language: system
        pass_filenames: false
        files: '^(app/i18n/|app/js/|app/index\.html$|scripts/check_i18n\.py$)'

      # Framework definitions: the schema plus the rules it cannot state (unique
      # ids, references that resolve, view ids and namespaces across the build,
      # reserved names). The engine trusts what passes (#168, R-63).
      - id: check-framework
        name: check the framework definitions
        entry: pixi run check-framework
        language: system
        pass_filenames: false
        files: '^app/frameworks/|^app/frameworks\.json$|^app/i18n/en\.json$|^schema/framework|^scripts/check_framework|^scripts/framework_enums\.py$'

      # docs/crosswalk.md against OPTICA's definition: its item table is the
      # definition's, and every count and correction it states about the current
      # mapping holds (#174, D-84).
      # The check and its mutation tests, whenever the page, a definition, the
      # checker or REQUIREMENTS.md (the open question R-69) changes.
      - id: check-crosswalk
        name: check the crosswalk page against OPTICA's definition
        entry: pixi run check-crosswalk
        language: system
        pass_filenames: false
        files: '^(docs/crosswalk\.md|REQUIREMENTS\.md|scripts/(gen_crosswalk|framework_enums)\.py)$|^app/frameworks/(optica|chai)/'
      - id: test-crosswalk
        name: test the crosswalk check
        entry: pixi run test-crosswalk
        language: system
        pass_filenames: false
        files: '^(docs/crosswalk\.md|REQUIREMENTS\.md|scripts/(gen_crosswalk|framework_enums)\.py|tests/test_crosswalk\.py|tests/fixtures/optica_crossrefs_before_174\.json)$|^app/frameworks/(optica|chai)/'

      # The checker's own mutation tests, whenever it, the schema or a definition changes.
      - id: test-check-framework
        name: test the framework definition checker
        entry: pixi run test-check-framework
        language: system
        pass_filenames: false
        files: '^app/frameworks/|^schema/framework|^scripts/check_framework|^scripts/framework_enums\.py$|^tests/test_check_framework\.py$|^app/i18n/en\.json$|^app/js/10-frameworks/05-project/'

      # A closed set of values gets an enumerated type, not a bare string. It is
      # a ratchet: scripts/enum_baseline.json holds the existing uses, a new one
      # fails, and fixing one fails until the baseline is ratcheted down. Run
      # over the whole tree (not per file) because staleness is a global fact.
      - id: check-enums
        name: check for strings used as enums
        entry: pixi run check-enums
        language: system
        pass_filenames: false
        files: '^(server/app/.*\.py|scripts/.*\.py|examples/.*\.py|app/js/.*\.js|scripts/enum_baseline\.json)$'

      # New ways of turning typed text into markup: an eval, an unescaped value in an
      # attribute, a URL built from text, a new innerHTML (#154). A ratchet, like the
      # enum check, so the existing reviewed ones do not block work.
      - id: check-injection
        name: check for unescaped text reaching markup
        entry: pixi run check-injection
        language: system
        pass_filenames: false
        files: '^(app/js/.*\.js|scripts/check_injection\.py|scripts/injection_baseline\.json)$'

      # The guardrail's own tests. A check never shown to fail is a claim, so
      # this runs whenever the checker or its tests change.
      # Every security claim in docs/security-claims.md must still be quoted in the
      # file it cites and backed by a test CI runs. Always runs: a claim goes stale
      # when ANY of the files it cites changes, and the check takes milliseconds.
      - id: check-claims
        name: check security claims against their evidence
        entry: pixi run check-claims
        language: system
        pass_filenames: false
        always_run: true

      - id: test-enums
        name: test the enum guardrail
        entry: pixi run test-enums
        language: system
        pass_filenames: false
        files: '^(scripts/check_enums\.py|tests/test_check_enums\.py)$'

      # The CI configuration, tested: does CI run every test that exists, and does
      # it fail when one cannot run? Runs when the workflows, the pixi tasks or the
      # tests change, so a test cannot be added and left out of CI (#32).
      - id: test-workflows
        name: test the CI configuration
        entry: pixi run test-workflows
        language: system
        pass_filenames: false
        files: '^(\.github/workflows/.*\.yml|pixi\.toml|compose\.yaml|tests/test_workflows\.py|tests/test_.*\.py)$'

      # Regenerates the published checklist pages from the framework definitions
      # (app/frameworks/<id>/). prek fails the run if this modifies a page, so the
      # docs cannot drift from the definitions. tests/test_framework_docs.py
      # asserts this filter still matches a definition.
      - id: gen-checklists
        name: regenerate generated checklist pages
        entry: pixi run gen-docs
        language: system
        pass_filenames: false
        files: '^(app/frameworks/|scripts/gen_.*\.py$)'

      # Rebuilds the single-file dashboard from app/. prek fails the run if
      # this changes docs/app/index.html or docs/app/manifest.json (the
      # retirement rules the server loads, D-76), so neither generated file can
      # be stale relative to its sources, and a hand edit is undone.
      - id: build-app
        name: rebuild the dashboard from app/
        entry: pixi run build-app
        language: system
        pass_filenames: false
        files: '^(app/|scripts/(build_app|build_manifest|framework_enums)\.py$|docs/app/manifest\.json$)'

      # Syntax, undefined names, use before declaration and duplicate declarations,
      # on the published page and a build of each app/frameworks/*/build.json (#176).
      - id: check-app
        name: check the built dashboard
        entry: pixi run check-app
        language: system
        pass_filenames: false
        files: '^(app/|docs/app/index\.html$|scripts/(build|check)_app\.py$)'

      - id: zensical-build
        name: zensical build (strict)
        entry: pixi run zensical build --clean --strict
        language: system
        pass_filenames: false
        files: '^(docs/|zensical\.toml$)'
